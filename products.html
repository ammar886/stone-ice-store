<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northwind Goods — Products</title>
    <meta name="description" content="Browse our full catalog." />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
  </head>
  <body>
    <div class="layout">
      <header class="site-header">
        <div class="wrap inner">
          <a class="logo" href="index.html">Northwind Goods</a>
          <nav class="nav" aria-label="Primary">
            <a href="index.html" data-nav>Home</a>
            <a href="products.html" data-nav>Products</a>
            <a href="about.html" data-nav>About</a>
          </nav>
        </div>
      </header>

      <main>
        <div class="wrap">
          <header class="page-intro">
            <h1>Products</h1>
            <p>Everything in one place — tap an item for details.</p>
          </header>
          <div id="all-products" class="product-grid"></div>
        </div>
      </main>

      <footer class="site-footer">
        <div class="wrap inner">
          <span>© Northwind Goods</span>
          <a href="about.html">Contact</a>
        </div>
      </footer>
    </div>

    <script src="js/products.js"></script>
    <script src="js/layout.js"></script>
    <script>
      (async function () {
        var grid = document.getElementById("all-products");
        var items = [];
        try {
          items = window.getAllProducts ? await window.getAllProducts() : window.STORE_PRODUCTS || [];
        } catch (err) {
          grid.innerHTML = '<p class="admin-muted">Unable to load products right now.</p>';
          return;
        }

        if (!items.length) {
          grid.innerHTML = '<p class="admin-muted">No products available yet.</p>';
          return;
        }

        items.forEach(function (p) {
          var card = document.createElement("article");
          card.className = "product-card";
          card.innerHTML =
            '<a class="card-link" href="product.html?id=' +
            encodeURIComponent(p.id) +
            '">' +
            '<div class="thumb"><img src="' +
            p.image +
            '" alt="" loading="lazy" width="800" height="900" /></div>' +
            '<div class="meta"><h3 class="product-name">' +
            escapeHtml(p.name) +
            "</h3></div></a>";
          grid.appendChild(card);
        });

        function escapeHtml(s) {
          var d = document.createElement("div");
          d.textContent = s;
          return d.innerHTML;
        }
      })();
    </script>
  </body>
</html>
